name: CI
on:
  push:
  pull_request:
  merge_group:
permissions: {}
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4"]'
      typo3-versions: '["^12.4", "^13.4"]'
      typo3-packages: '["typo3/cms-core"]'
